name: Build Android APK (ChilloutFM)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android/**
      - capacitor.config.ts
      - dist/**
      - package.json
      - .github/workflows/build-android-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure Capacitor asset directories exist
        run: mkdir -p android/app/src/main/assets/public

      - name: Sync Capacitor Android project
        env:
          # Необязательно. Если не задано, берётся URL из capacitor.config.ts
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
        run: npx cap sync android

      - name: Patch Java compatibility to 17 for CI
        run: |
          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' android/app/capacitor.build.gradle
          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' android/capacitor-cordova-android-plugins/build.gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chilloutfm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChilloutFM.apk

      - name: Create/update Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ChilloutFM (последняя версия)
          body: |
            🎧 **ChilloutFM** — атмосферное интернет-радио для Android.

            ### 📲 Установка
            1. Скачайте файл **ChilloutFM.apk** ниже
            2. Откройте его на телефоне
            3. Разрешите «Установка из этого источника», если Android спросит
            4. Нажмите «Установить»

            Сборка обновляется автоматически при каждом изменении.
          files: ChilloutFM.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
